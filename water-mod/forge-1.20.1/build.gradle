plugins { id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' }
version = "1.20.1-forge-${mod_version}"
group = 'com.montella.water'
base { archivesName = 'montella_water_physics' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { montella_water { source sourceSets.main } }
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    manifest { attributes(['Specification-Title': 'montella_water', 'Implementation-Title': 'montella_water', 'Implementation-Version': project.version]) }
    finalizedBy 'reobfJar'
}
