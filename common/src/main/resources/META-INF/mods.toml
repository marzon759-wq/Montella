modLoader="javafml"
loaderVersion="${loader_range}"
license="All Rights Reserved"

[[mods]]
modId="hatman"
version="${mod_version}"
displayName="The Hatman: Hollow House"
authors="krolasyon"
description='''
A story-driven analog horror. You are a detective sent into Marlowe House to find your missing partner.
Something in a hat is already inside. It is polite. It asks questions. It does not like liars.
Start the story with /hatman start (or /hatman basla).
'''

[[dependencies.hatman]]
    modId="forge"
    mandatory=true
    versionRange="${loader_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.hatman]]
    modId="minecraft"
    mandatory=true
    versionRange="${mc_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.hatman]]
    modId="geckolib"
    mandatory=true
    versionRange="${gecko_range}"
    ordering="AFTER"
    side="BOTH"
