plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}
version = "${mc_version}-forge-${mod_version}"
group = 'com.krolasyon.titans'
base { archivesName = 'titan_clash' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: mc_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { titanclash { source sourceSets.main } }
        }
        client {
            if (System.getenv('TITAN_AUTOTEST') != null) property 'titan.autotest', System.getenv('TITAN_AUTOTEST')
            args '--width', '1280', '--height', '720'
        }
        server { args '--nogui' }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
}
tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: mod_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    manifest { attributes(['Specification-Title': 'titanclash', 'Implementation-Title': 'titanclash', 'Implementation-Version': project.version]) }
    finalizedBy 'reobfJar'
}
