modLoader="javafml"
loaderVersion="${loader_range}"
license="All Rights Reserved"

[[mods]]
modId="bloodsea"
version="${mod_version}"
displayName="Blood Sea"
authors="krolasyon"
logoFile="bloodsea_logo.png"
credits="Cat sounds: kerzoven (CC0), ignasd (CC0), macro (CC-BY 3.0) on freesound.org"
description='''
A story-driven horror survival mod. You wake face down on a raft in an endless sea of blood, with a black cat
you have never seen and a hand-drawn map. Why are you here, and where is this?

Eighteen cutscenes, choices that decide one of four endings, a real night under the Blood Moon, five creatures
that cannot be killed, and a white sun that is not a sun. Create a new world and the story begins by itself.
'''

[[dependencies.bloodsea]]
    modId="forge"
    mandatory=true
    versionRange="${loader_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.bloodsea]]
    modId="minecraft"
    mandatory=true
    versionRange="${mc_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.bloodsea]]
    modId="geckolib"
    mandatory=true
    versionRange="${gecko_range}"
    ordering="AFTER"
    side="BOTH"
