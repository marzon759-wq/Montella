[[mods]]
modId="mimicry"
version="${mod_version}"
displayName="MIMIC: Harrow Farm"
authors="krolasyon"
description='''
A story-driven horror. Your sister called from the family farm: something there is wearing your father's voice.
It hunts by sound. It learns every word you say. Five chapters, timed choices, four endings.
Start with /mimic start in a new world.
'''

[[dependencies.mimicry]]
    modId="forge"
    mandatory=true
    versionRange="${loader_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.mimicry]]
    modId="minecraft"
    mandatory=true
    versionRange="${mc_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.mimicry]]
    modId="geckolib"
    mandatory=true
    versionRange="${gecko_range}"
    ordering="AFTER"
    side="BOTH"
